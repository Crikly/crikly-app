# TEST-E2E-01: Playwright E2E tests for the coach app.
#
# Runs on every PR targeting develop or main, and on every push to develop.
# Does NOT run on push to main — release work goes through PRs.
#
# TECH-09: the suite runs against a LOCAL Supabase stack started inside the
# runner (`supabase start` — same config.toml and migrations as local dev,
# minus services the app does not use). The job holds NO hosted Supabase URL or key, so it cannot reach
# staging or production. Do not add hosted Supabase secrets back to this job.
#
# Required GitHub Secrets (5):
#   STRIPE_SECRET_KEY              (test mode sk_test_… — server module-load + P15 fixture)
#   NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY (test mode pk_test_…)
#   STRIPE_WEBHOOK_SECRET          (test mode whsec_… — module-load only; no webhook is delivered in CI)
#   RESEND_API_KEY                 (test or dummy — module-load only)
#   ONESIGNAL_REST_API_KEY         (optional — only if any dev-load reads it)

name: E2E

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

# Single in-flight run per ref — newer pushes cancel an earlier run.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright (chromium)
    # TECH-05: pinned — Playwright 1.58.2 has no Ubuntu 26.04 support
    # (added in 1.61). Unpin when Playwright is upgraded.
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      # TECH-09: NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY and
      # SUPABASE_SERVICE_ROLE_KEY are NOT set here — the "Start local Supabase"
      # step exports the local stack's values for the steps after it.
      #
      # Throwaway credentials for the local stack only. seed.ts creates this
      # user in the runner's own database; they open nothing anywhere else.
      # Playwright reports record typed values, so these must never be real.
      TEST_COACH_EMAIL: e2e-coach@crikly-e2e.test
      TEST_COACH_PASSWORD: e2e-local-stack-only-Pw1
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      # Fix-CI-01: un-gate /coach/* and /onboarding/* in CI. Without this the
      # MS-18 proxy guard redirects protected routes to /home, timing out the
      # coach/session/RBAC E2E tests. Quoted so it matches the proxy's exact
      # string check (process.env.NEXT_PUBLIC_COACH_APP_LIVE !== 'true').
      NEXT_PUBLIC_COACH_APP_LIVE: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers (chromium only)
        run: npx playwright install --with-deps chromium

      # TECH-09: pinned to the CLI version the suite is verified against locally.
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.113.0

      - name: Start local Supabase
        # Applies supabase/migrations + seed.sql to a fresh database. Services
        # the app and suite do not use are excluded to shorten the image pull.
        # Must run before "Build app": NEXT_PUBLIC_* values are inlined at build.
        env:
          # config.toml enables Google OAuth through env(). Dummy values so the
          # CLI never starts with them unset — Google sign-in is not exercised
          # in CI and these open nothing.
          GOOGLE_CLIENT_ID: e2e-dummy-client-id
          GOOGLE_CLIENT_SECRET: e2e-dummy-client-secret
        run: |
          supabase start -x studio,postgres-meta,realtime,imgproxy,edge-runtime,logflare,vector,supavisor
          supabase status -o env > "$RUNNER_TEMP/supabase.env"
          get() { grep -E "^$1=" "$RUNNER_TEMP/supabase.env" | head -n 1 | cut -d= -f2- | tr -d '"'; }
          API_URL="$(get API_URL)"
          PUBLISHABLE_KEY="$(get PUBLISHABLE_KEY)"
          SECRET_KEY="$(get SECRET_KEY)"
          if [ -z "$API_URL" ] || [ -z "$PUBLISHABLE_KEY" ] || [ -z "$SECRET_KEY" ]; then
            echo "::error::could not read the local Supabase URL/keys from 'supabase status'"
            exit 1
          fi
          # Guard: this job may only ever talk to the stack on this runner.
          case "$API_URL" in
            http://127.0.0.1:*|http://localhost:*) ;;
            *) echo "::error::Supabase URL is not local ($API_URL) — refusing to continue"; exit 1 ;;
          esac
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$PUBLISHABLE_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SECRET_KEY"
          } >> "$GITHUB_ENV"

      - name: Build app
        # TEST-E2E-02 CI fix: precompile Next.js so the playwright webServer
        # can `npm run start` against a built app. Avoids the 60-90s of cold
        # compilation that `npm run dev` would do on the first page hit and
        # was the root cause of webServer timeouts on CI.
        run: npm run build

      - name: Seed test coach
        run: npx tsx e2e/fixtures/seed.ts

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
